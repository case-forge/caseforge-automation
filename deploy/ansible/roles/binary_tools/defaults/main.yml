---

binary_tools_github_releases:
  - name: zellij
    repo: zellij-org/zellij
    asset_template: "zellij-{arch}-unknown-linux-musl.tar.gz"
    arch_map: { x86_64: x86_64, aarch64: aarch64 }
    binary_in_archive: zellij
    install_path: /usr/local/bin/zellij

binary_tools_raw_binaries:
  - name: cloudflared
    url_template: "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-{arch}"
    arch_map: { x86_64: amd64, aarch64: arm64 }
    install_path: /usr/local/bin/cloudflared


binary_tools_opentofu_version: "1.13.9"


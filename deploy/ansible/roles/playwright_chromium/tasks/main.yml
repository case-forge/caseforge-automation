---
- name: Check for existing Playwright Python package
  ansible.builtin.command: python3 -m playwright --version
  register: playwright_pkg_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: "[caseforge] Playwright Chromium (dev role only)"
  when: playwright_pkg_check.rc == 0
  block:
    - name: Install Chromium's OS-level dependencies
      ansible.builtin.command: python3 -m playwright install-deps chromium
      changed_when: true

    - name: Install/verify Playwright's pinned Chromium build
      ansible.builtin.command: python3 -m playwright install chromium
      changed_when: true
      register: playwright_chromium_install

    - name: "[caseforge] Playwright Chromium present"
      ansible.builtin.debug:
        msg: "[caseforge] Playwright Chromium present"

- name: "[caseforge] Playwright package not installed -- Chromium skipped"
  ansible.builtin.debug:
    msg: >-
      [caseforge][WARN] playwright Python package not installed --
      run: pip3 install 'playwright>=1.40,<2' && python3 -m playwright install chromium
  when: playwright_pkg_check.rc != 0
